name: TravelConnect verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TravelConnect-MVP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: API and frontend regression tests
        run: npm test
      - name: Firebase project public configuration preflight
        run: npm run firebase:check
        continue-on-error: true
